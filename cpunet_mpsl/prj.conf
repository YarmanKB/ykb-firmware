CONFIG_LIB_YKB_ESB=y
CONFIG_LIB_YKB_TIMESLOT=y

CONFIG_RING_BUFFER=y

CONFIG_DYNAMIC_INTERRUPTS=y
CONFIG_DYNAMIC_DIRECT_INTERRUPTS=y

CONFIG_ESB=y
CONFIG_ESB_DYNAMIC_INTERRUPTS=y

CONFIG_MPSL=y
CONFIG_MPSL_TIMESLOT_SESSION_COUNT=1

CONFIG_IPC_SERVICE=y
CONFIG_MBOX=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_ISR_STACK_SIZE=1024
CONFIG_IDLE_STACK_SIZE=256
# bt_enable_raw() + ipc_service_open_instance() require a larger main stack;
# 2048 is not enough and causes cpunet to crash before IPC binds.
CONFIG_MAIN_STACK_SIZE=4096

CONFIG_BT=y
CONFIG_BT_HCI_RAW=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_BROADCASTER=y
CONFIG_BT_OBSERVER=n
CONFIG_BT_EXT_ADV=y
CONFIG_BT_PER_ADV=n
CONFIG_BT_PER_ADV_SYNC=n
CONFIG_BT_CENTRAL=n
CONFIG_BT_PERIPHERAL=y

CONFIG_NRF_RPC=y
CONFIG_NRF_RPC_CBOR=y
CONFIG_THREAD_CUSTOM_DATA=y
# One thread is sufficient: ESB commands arrive serially (cpuapp blocks waiting
# for each response), so no concurrency is needed in the RPC handler pool.
CONFIG_NRF_RPC_THREAD_POOL_SIZE=1
CONFIG_NRF_RPC_THREAD_STACK_SIZE=2048

# Deferred logging avoids blocking in high-priority (timeslot callback) context
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
