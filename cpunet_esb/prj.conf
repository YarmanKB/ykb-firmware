CONFIG_LIB_YKB_ESB=y
# BT is absent; override the "default y if BT" so ESB still uses MPSL timeslots.
# CONFIG_LIB_YKB_ESB_MPSL=y

CONFIG_RING_BUFFER=y

CONFIG_DYNAMIC_INTERRUPTS=y
CONFIG_DYNAMIC_DIRECT_INTERRUPTS=y

CONFIG_ESB=y
CONFIG_ESB_DYNAMIC_INTERRUPTS=y

# CONFIG_MPSL=y
# CONFIG_MPSL_TIMESLOT_SESSION_COUNT=1

CONFIG_IPC_SERVICE=y
CONFIG_MBOX=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_ISR_STACK_SIZE=1024
CONFIG_IDLE_STACK_SIZE=256
CONFIG_MAIN_STACK_SIZE=2048

CONFIG_NRF_RPC=y
CONFIG_NRF_RPC_CBOR=y
CONFIG_THREAD_CUSTOM_DATA=y
CONFIG_NRF_RPC_THREAD_POOL_SIZE=1
CONFIG_NRF_RPC_THREAD_STACK_SIZE=2048

CONFIG_LOG=y
